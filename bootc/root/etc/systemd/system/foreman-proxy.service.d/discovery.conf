[Unit]
After=basic.target network-online.target nm-prepare.service
Wants=basic.target network-online.target nm-prepare.service
ConditionPathExists=/etc/NetworkManager/system-connections/primary

[Service]
EnvironmentFile=-/etc/default/discovery
ExecStartPre=+/usr/bin/generate-proxy-cert
TimeoutStartSec=9999
# Script-provided facts under /tmp/facts are shared with the register process.
PrivateTmp=false
