# Seed extension content into writable storage before discovery services start.
C /var/opt/extension - - - - /usr/share/fdi/extension
# State directories created by RPM scriptlets, also needed on a fresh /var.
d /var/lib/foreman-proxy 0755 foreman-proxy foreman-proxy -
d /var/log/foreman-proxy 0750 foreman-proxy foreman-proxy -
d /var/spool/foreman-proxy 0750 foreman-proxy foreman-proxy -
d /var/lib/lldpad 0755 root root -
d /var/lib/net-snmp 0755 root root -
d /var/lib/net-snmp/cert_indexes 0755 root root -
d /var/lib/net-snmp/mib_indexes 0755 root root -
